# Use Ctrl+s as prefix
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix


set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on


bind | split-window -h
bind - split-window -v

bind r source-file ~/.tmux.conf \; display "Config reloaded"

set -g status on
set -g status-position bottom

set -g status-style "bg=#101010"

set -g status-left "#[fg=#dddddd,bg=black]"
set -g status-right "#[fg=#dddddd,bg=black]"

setw -g window-status-format "#[fg=#dddddd] #W "
setw -g window-status-current-format "#[fg=#101010,bg=#dddddd,bold] #I:#W "

set -g pane-border-style "fg=white"
set -g pane-active-border-style "fg=white"

set -g message-style "bg=black,fg=white"
set -g mode-style "bg=white,fg=black"
set -g mode-keys vi

set -sg escape-time 0

set -g mouse off
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
set -g history-limit 100000

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# unbind defaults
unbind 0
unbind 1
unbind 2
unbind 3

# remap keys
bind 8 select-window -t 1
bind 9 select-window -t 2
bind 0 select-window -t 3
bind - select-window -t 4
bind . select-window -t 5
